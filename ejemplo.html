<!DOCTYPE html>
<html lang='es'>
<head>
  <meta charset='UTF-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1.0'>
  <title>Smart Home</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background: #f7f7f7; }
    .sensores { border: 1px solid green; padding: 20px; margin-bottom: 20px; background: #ffffff; }
    .actuador { border: 1px solid gray; padding: 20px; margin-bottom: 20px; background: #ffffff; }
    h1, h2 { margin-top: 0; }
    ul { margin: 0; padding-left: 22px; }
    li { margin-bottom: 6px; }
  </style>
</head>
<body>
  <h1>Smart Home</h1>
  <div class='sensores'>
    <h1>Sensores</h1>
    <h2>reloj.hora</h2>
    <ul>
      <li>reloj.hora &gt; 22:00</li>
    </ul>
  </div>
  <div class='actuador'>
    <h1>altavoz_comedor</h1>
    <ul>
      <li>mensaje: Hora de dormir</li>
    </ul>
  </div>
</body>
</html>
